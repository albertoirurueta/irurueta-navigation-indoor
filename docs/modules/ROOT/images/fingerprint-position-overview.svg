<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Helvetica, Arial, sans-serif">
  <rect x="8" y="8" width="624" height="384" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="320" y="34" text-anchor="middle" font-size="13" fill="#334155" font-weight="600">
    known fingerprint database (each dot = a location with a recorded RSSI vector)
  </text>

  <!-- connecting lines from the new reading to its k = 3 nearest matches in signal space -->
  <g stroke="#f59e0b" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="230" y1="150" x2="320" y2="190"/>
    <line x1="230" y1="150" x2="320" y2="90"/>
    <line x1="230" y1="150" x2="100" y2="190"/>
  </g>

  <!-- reference points: dot + a 3-bar "signature" of RSSI from AP1 (blue) / AP2 (green) / AP3 (purple) -->
  <!-- not selected as a nearest neighbour -->
  <g>
    <circle cx="100" cy="90" r="6" fill="#94a3b8"/>
    <rect x="90" y="112" width="5" height="25" fill="#2563eb"/><rect x="97" y="131" width="5" height="6" fill="#16a34a"/><rect x="104" y="119" width="5" height="18" fill="#7c3aed"/>

    <circle cx="540" cy="90" r="6" fill="#94a3b8"/>
    <rect x="530" y="115" width="5" height="22" fill="#2563eb"/><rect x="537" y="127" width="5" height="10" fill="#16a34a"/><rect x="544" y="123" width="5" height="14" fill="#7c3aed"/>

    <circle cx="540" cy="190" r="6" fill="#94a3b8"/>
    <rect x="530" y="228" width="5" height="9" fill="#2563eb"/><rect x="537" y="219" width="5" height="18" fill="#16a34a"/><rect x="544" y="211" width="5" height="26" fill="#7c3aed"/>

    <circle cx="100" cy="290" r="6" fill="#94a3b8"/>
    <rect x="90" y="329" width="5" height="8" fill="#2563eb"/><rect x="97" y="329" width="5" height="8" fill="#16a34a"/><rect x="104" y="312" width="5" height="25" fill="#7c3aed"/>

    <circle cx="320" cy="290" r="6" fill="#94a3b8"/>
    <rect x="310" y="331" width="5" height="6" fill="#2563eb"/><rect x="317" y="322" width="5" height="15" fill="#16a34a"/><rect x="324" y="315" width="5" height="22" fill="#7c3aed"/>

    <circle cx="540" cy="290" r="6" fill="#94a3b8"/>
    <rect x="530" y="317" width="5" height="20" fill="#2563eb"/><rect x="537" y="317" width="5" height="20" fill="#16a34a"/><rect x="544" y="331" width="5" height="6" fill="#7c3aed"/>
  </g>

  <!-- the three nearest matches, highlighted -->
  <g>
    <circle cx="320" cy="190" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="320" cy="190" r="6" fill="#94a3b8"/>
    <rect x="310" y="212" width="5" height="15" fill="#2563eb"/><rect x="317" y="207" width="5" height="20" fill="#16a34a"/><rect x="324" y="217" width="5" height="10" fill="#7c3aed"/>

    <circle cx="320" cy="90" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="320" cy="90" r="6" fill="#94a3b8"/>
    <rect x="310" y="114" width="5" height="13" fill="#2563eb"/><rect x="317" y="104" width="5" height="23" fill="#16a34a"/><rect x="324" y="119" width="5" height="8" fill="#7c3aed"/>

    <circle cx="100" cy="190" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="100" cy="190" r="6" fill="#94a3b8"/>
    <rect x="90" y="211" width="5" height="16" fill="#2563eb"/><rect x="97" y="208" width="5" height="19" fill="#16a34a"/><rect x="104" y="216" width="5" height="11" fill="#7c3aed"/>
  </g>

  <!-- the new (unlocated) reading and its own signature -->
  <circle cx="230" cy="150" r="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="230" y="155" text-anchor="middle" font-size="12" fill="#92400e" font-weight="700">?</text>
  <rect x="220" y="171" width="5" height="22" fill="#2563eb"/><rect x="227" y="162" width="5" height="31" fill="#16a34a"/><rect x="234" y="184" width="5" height="9" fill="#7c3aed"/>
  <text x="215" y="112" text-anchor="middle" font-size="11" fill="#92400e">new reading (unknown location)</text>

  <!-- estimated position: weighted average of the k nearest matches -->
  <circle cx="278" cy="163" r="6" fill="#f59e0b"/>
  <text x="300" y="150" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">estimated position</text>

  <!-- legend -->
  <g font-size="11" fill="#334155">
    <rect x="20" y="352" width="10" height="10" fill="#2563eb"/><text x="35" y="361">RSSI from AP1</text>
    <rect x="140" y="352" width="10" height="10" fill="#16a34a"/><text x="155" y="361">RSSI from AP2</text>
    <rect x="260" y="352" width="10" height="10" fill="#7c3aed"/><text x="275" y="361">RSSI from AP3</text>
    <circle cx="410" cy="357" r="6" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="422" y="361">k nearest matches</text>
  </g>

  <!-- caption -->
  <text x="320" y="418" text-anchor="middle" font-size="13" fill="#334155">
    compare the new signal-strength vector against the database &#8594; find its closest matches
  </text>
  <text x="320" y="438" text-anchor="middle" font-size="11" fill="#94a3b8">
    estimated position = weighted average of the k nearest matches' known locations
  </text>
</svg>
