<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="frame-radiosource">
      <rect x="8" y="8" width="624" height="384" rx="12" ry="12"/>
    </clipPath>
    <marker id="arrow-radiosource" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="624" height="384" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g clip-path="url(#frame-radiosource)">
    <!-- signal radiated equally in all directions from the (unknown) source, decaying with distance -->
    <g fill="none" stroke="#f59e0b">
      <circle cx="320" cy="220" r="40" opacity="0.55"/>
      <circle cx="320" cy="220" r="80" opacity="0.42"/>
      <circle cx="320" cy="220" r="120" opacity="0.32"/>
      <circle cx="320" cy="220" r="160" opacity="0.22"/>
      <circle cx="320" cy="220" r="200" opacity="0.14"/>
      <circle cx="320" cy="220" r="240" opacity="0.08"/>
    </g>
  </g>

  <!-- distance implied between the estimated source and each known receiver -->
  <g stroke="#475569" stroke-width="1" stroke-dasharray="4 3">
    <line x1="320" y1="220" x2="250" y2="180" marker-end="url(#arrow-radiosource)"/>
    <line x1="320" y1="220" x2="480" y2="100" marker-end="url(#arrow-radiosource)"/>
    <line x1="320" y1="220" x2="130" y2="340" marker-end="url(#arrow-radiosource)"/>
  </g>

  <!-- known receivers (anchors) and their measured RSSI -->
  <g>
    <circle cx="250" cy="180" r="8" fill="#2563eb"/>
    <text x="250" y="163" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">Receiver 1</text>
    <text x="250" y="200" text-anchor="middle" font-size="11" fill="#64748b">RSSI = −50 dBm (strong, close)</text>

    <circle cx="480" cy="100" r="8" fill="#2563eb"/>
    <text x="480" y="80" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">Receiver 2</text>
    <text x="480" y="120" text-anchor="middle" font-size="11" fill="#64748b">RSSI = −68 dBm</text>

    <circle cx="130" cy="340" r="8" fill="#2563eb"/>
    <text x="130" y="368" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="600">Receiver 3</text>
    <text x="130" y="322" text-anchor="middle" font-size="11" fill="#64748b">RSSI = −72 dBm (weak, far)</text>
  </g>

  <!-- estimated source position -->
  <circle cx="320" cy="220" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="320" y="246" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">estimated source position</text>

  <!-- caption -->
  <text x="320" y="418" text-anchor="middle" font-size="13" fill="#334155">
    receivers at known positions measure the source's signal &#8594; solve for the source position
  </text>
  <text x="320" y="438" text-anchor="middle" font-size="11" fill="#94a3b8">
    (and its transmitted power) that best explains every observed signal strength at once
  </text>
</svg>
